<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Derby</title>
  <meta name="description" content="Bloodline and pedigree records for gamefowl breeders.">
  <meta name="theme-color" content="#121417">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Derby">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="appbar">
    <a id="back" class="back" href="#/" aria-label="Back" data-i18n-aria="common.back" hidden>‹</a>
    <img class="brand" src="icons/logo.png" alt="">
    <h1 id="title">Derby</h1>
    <div id="lang" class="lang" role="group" aria-label="Language / Wika"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="birds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span data-i18n="nav.birds">Birds</span>
    </a>
    <a href="#/keep" data-nav="keep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span data-i18n="nav.keep">Keep</span>
    </a>
    <a href="#/mating" data-nav="mating">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>

    </a>
    <a href="#/lines" data-nav="lines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v6M12 9l-6 5v7M12 9l6 5v7M6 14h0M18 14h0"/></svg>
      <span data-i18n="nav.lines">Bloodlines</span>
    </a>
    <a href="#/more" data-nav="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="10" cy="18" r="1"/></svg>
      <span data-i18n="nav.more">More</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sheet" class="sheet" hidden></div>
  <noscript><p style="padding:16px">Derby needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
